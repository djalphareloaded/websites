<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Kürze für Sie da | Under Construction</title>
    <style>
        :root {
            --primary-color: #2d3436;
            --accent-color: #0984e3;
            --text-light: #636e72;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            color: var(--primary-color);
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            color: var(--primary-color);
        }

        .logo span {
            color: var(--accent-color);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 2rem;
            color: var(--text-light);
        }

        .status-bar {
            width: 100%;
            height: 6px;
            background: #dfe6e9;
            border-radius: 3px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress {
            width: 65%;
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            animation: progressAnim 2s infinite ease-in-out;
        }

        @keyframes progressAnim {
            0% { margin-left: -100%; width: 30%; }
            50% { margin-left: 0%; width: 40%; }
            100% { margin-left: 100%; width: 30%; }
        }

        .contact-info {
            font-size: 0.9rem;
            color: var(--text-light);
            border-top: 1px solid #dfe6e9;
            padding-top: 1.5rem;
        }

        .contact-info a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Yannick <span>Böke</span></div>
        <h1>Wir arbeiten gerade an etwas Großartigem.</h1>
        
        <div class="status-bar">
            <div class="progress"></div>
        </div>

        <p>Unsere neue Website befindet sich aktuell im Aufbau. <br> Schauen Sie bald wieder vorbei!</p>
		
    </div>

</body>
</html>
